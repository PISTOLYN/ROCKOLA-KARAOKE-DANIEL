name: Compilar Rockola Karaoke
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  compilar:
    runs-on: windows-2022
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restaurar paquete SQLite
        shell: pwsh
        run: |
          nuget restore src/RockolaKaraoke/packages.config -PackagesDirectory packages -NonInteractive
          $dll = "packages/Stub.System.Data.SQLite.Core.NetFramework.1.0.118/lib/net46/System.Data.SQLite.dll"
          if (!(Test-Path $dll)) {
            Write-Host "No se encontró System.Data.SQLite.dll en la ruta esperada: $dll"
            Write-Host "Archivos SQLite encontrados en paquetes:"
            Get-ChildItem packages -Recurse -Filter System.Data.SQLite.dll | Select-Object -ExpandProperty FullName
            throw "Falta el ensamblado administrado de SQLite"
            exit 1
          }

      - name: Compilar Release
        run: msbuild RockolaKaraoke.sln /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      - name: Guardar archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: RockolaKaraoke-Windows
          path: src/RockolaKaraoke/bin/Release/
