name: Build ALEXA
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore and build Release
        run: msbuild ALEXA.sln /restore /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
      - name: Upload ALEXA build
        uses: actions/upload-artifact@v4
        with:
          name: ALEXA-Windows-Release
          path: |
            bin/Release/**
            **/bin/Release/**
          if-no-files-found: error
          retention-days: 14
